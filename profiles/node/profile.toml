id = "node"
description = "Node.js and TypeScript application and library defaults."
source_globs = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.cjs", "**/package.json", "**/tsconfig*.json"]
generated_globs = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/coverage/**"]

[commands]
lint = "npm run lint"
typecheck = "npm run typecheck"
test = "npm test"
build = "npm run build"
