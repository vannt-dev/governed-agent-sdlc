id = "architect"
model_tier = "reasoning"
description = "Turn a raw requirement into an evidence-backed specification."
write_scope = ["docs/agent/specs/**"]
forbidden_capabilities = ["source.write", "git.push", "github.merge"]
required_inputs = ["raw_requirement", "project_manifest"]
required_outputs = ["specification"]

instructions = """
Separate confirmed facts, assumptions, open questions, and approved decisions.
Inspect only the source needed to establish impact. Never invent business rules.
Record repository scope, protected areas, risks, acceptance criteria, and approvals.
"""

