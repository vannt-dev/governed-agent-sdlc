name: Validate Governed Agent SDLC

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      # A pull request runs every Python on Linux and the newest one on Windows and
      # macOS; main runs all nine. macOS runners are few and shared by every repository,
      # and an OS problem seldom depends on the Python version.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-26.04","python":"3.11"},{"os":"ubuntu-26.04","python":"3.12"},{"os":"ubuntu-26.04","python":"3.13"},{"os":"windows-latest","python":"3.13"},{"os":"macos-latest","python":"3.13"}]' || '[{"os":"ubuntu-26.04","python":"3.11"},{"os":"ubuntu-26.04","python":"3.12"},{"os":"ubuntu-26.04","python":"3.13"},{"os":"windows-latest","python":"3.11"},{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.13"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.12"},{"os":"macos-latest","python":"3.13"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        # uv is what the generated hooks run the guards with; the adapter tests go that way
        run: python -m pip install -e . uv==0.12.10
      - name: Validate
        run: agentkit validate
      - name: Test
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]" uv==0.12.10
      - name: Lint and format
        run: |
          ruff check src hooks tests
          ruff format --check src hooks tests
          python tests/workflow_checks.py
      - name: Type check
        run: mypy
      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

  package:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned build tools
        run: python -m pip install build==1.6.1 hatchling==1.32.0 twine==7.0.0
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv .temp/package-smoke
          .temp/package-smoke/bin/python -m pip install dist/*.whl
          mkdir .temp/sample-project
          cd .temp/sample-project
          ../package-smoke/bin/agentkit init . --name smoke --adapter codex
          ../package-smoke/bin/python -c 'from pathlib import Path; p = Path(".agent/project.toml"); p.write_text(p.read_text().replace("profiles = [\"generic\"]", "profiles = [\"generic\", \"codex\", \"claude-code\"]"))'
          ../package-smoke/bin/agentkit doctor .
          ../package-smoke/bin/python -c "from importlib.resources import files; root = files('agentkit.resources'); assert all(root.joinpath(name).is_dir() for name in ('core', 'hooks', 'profiles', 'adapters'))"
          ../package-smoke/bin/python -c "from importlib.resources import files; assert files('agentkit').joinpath('py.typed').is_file()"

  browser:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser tooling
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Run browser checks
        run: python tests/browser_checks.py

  # The one status branch protection requires: the test matrix differs between pull
  # requests and main, so its legs cannot be required by name.
  result:
    name: CI result
    if: always()
    needs: [test, quality, package, browser]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Evaluate jobs
        env:
          RESULTS: ${{ needs.test.result }} ${{ needs.quality.result }} ${{ needs.package.result }} ${{ needs.browser.result }}
        run: |
          echo "test quality package browser: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::a job did not succeed ($r)"; exit 1; fi
          done
