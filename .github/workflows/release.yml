name: Release Governed Agent SDLC

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to release or publish (for example v0.1.0)"
        required: true
        type: string
      publish_to_pypi:
        description: "Publish distribution packages to PyPI"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    if: ${{ github.event_name == 'push' || inputs.publish_to_pypi != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build toolchain
        run: python -m pip install build==1.6.1 hatchling==1.32.0 twine==7.0.0

      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([ab]|rc)?[0-9]*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $RELEASE_TAG is not derived from origin/main" >&2
            exit 1
          fi

      - name: Require a new GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to rebuild different assets." >&2
            exit 1
          fi

      - name: Build distribution packages
        run: |
          python -m build
          python -m twine check dist/*

      - name: Attest distribution packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes

  publish-pypi:
    name: Publish existing release assets to PyPI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi == true }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/governed-agent-sdlc
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([ab]|rc)?[0-9]*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download exact GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern "governed_agent_sdlc-*.whl" \
            --pattern "governed_agent_sdlc-*.tar.gz"
          test -f "dist/governed_agent_sdlc-${version}-py3-none-any.whl"
          test -f "dist/governed_agent_sdlc-${version}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Verify release asset attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
