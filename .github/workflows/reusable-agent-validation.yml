name: Reusable Agent Validation

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run Agent Workbench
        required: false
        default: "3.12"
        type: string
      manifest-path:
        description: Directory containing agentkit.toml or .agent/project.toml
        required: false
        default: "."
        type: string
      toolkit-ref:
        description: >-
          Governed Agent SDLC revision to execute. Empty (the default) runs the revision of
          this workflow file that the caller's `uses:` line pinned, so a caller on a release
          tag or commit never picks up an unreleased main.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Governed Agent SDLC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vannt-dev/governed-agent-sdlc
          # job.workflow_sha is the commit of this reusable file, not of the caller
          ref: ${{ inputs.toolkit-ref || job.workflow_sha }}
          path: .agentkit-runtime
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Validate caller
        working-directory: ${{ inputs.manifest-path }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentkit-runtime/src
        run: python -m agentkit validate
