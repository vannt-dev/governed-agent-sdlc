# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: ci
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  commits:
    uses: vannt-dev/repokeeper/.github/workflows/commitlint.yml@v0
  python:
    uses: vannt-dev/repokeeper/.github/workflows/stack-python.yml@v0
    with:
      python-versions: '["3.11","3.12","3.13"]'
      os: '["ubuntu-latest"]'
      manager: uv
      install-command: uv sync --frozen && uv pip install ruff mypy pytest
      commands: '["uv run ruff format --check .","uv run ruff check .","uv run mypy","uv run pytest"]'
  result:
    name: CI result
    if: always()
    needs:
      - python
      - commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
